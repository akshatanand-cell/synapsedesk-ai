<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="SynapseDesk AI: Hands-First Autonomous Spatial Workspace Protocol for Meta Quest" />
    <meta name="theme-color" content="#07090e" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%230284c7'/><circle cx='50' cy='50' r='20' fill='%2338bdf8'/></svg>" />
    <title>SynapseDesk AI — Autonomous Spatial Workspace Protocol</title>
    <style>
      :root {
        --cyan: #38bdf8;
        --purple: #a855f7;
        --bg-panel: rgba(15, 23, 42, 0.85);
        --border-glass: rgba(56, 189, 248, 0.3);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        user-select: none;
      }
      body {
        background-color: #06080e;
        color: #f8fafc;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      /* 3D WebXR Canvas Container */
      #scene-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
      /* Top Floating Glass Navigation */
      .top-nav {
        position: fixed;
        top: 20px;
        left: 24px;
        right: 24px;
        z-index: 20;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 24px;
        background: var(--bg-panel);
        border: 1px solid var(--border-glass);
        border-radius: 16px;
        backdrop-filter: blur(16px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }
      .brand-group {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--cyan);
        box-shadow: 0 0 12px var(--cyan);
        animation: pulse 2s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(0.85); }
      }
      .brand-title {
        font-weight: 800;
        font-size: 17px;
        letter-spacing: -0.01em;
        background: linear-gradient(135deg, #ffffff 40%, var(--cyan) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .pill-badge {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        padding: 4px 10px;
        border-radius: 9999px;
        background: rgba(56, 189, 248, 0.12);
        color: var(--cyan);
        border: 1px solid rgba(56, 189, 248, 0.3);
      }
      .nav-links {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .nav-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        font-size: 13px;
        font-weight: 600;
        color: #e2e8f0;
        background: rgba(30, 41, 59, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .nav-btn:hover {
        background: rgba(51, 65, 85, 0.9);
        border-color: var(--cyan);
        color: #ffffff;
        transform: translateY(-1px);
      }
      /* Bottom Floating Controls */
      .bottom-bar {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .btn-launch-vr {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 14px 32px;
        font-size: 16px;
        font-weight: 700;
        color: #ffffff;
        background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
        border: 1px solid rgba(56, 189, 248, 0.6);
        border-radius: 9999px;
        cursor: pointer;
        box-shadow: 0 0 25px rgba(2, 132, 199, 0.6);
        transition: all 0.2s ease;
      }
      .btn-launch-vr:hover {
        transform: scale(1.04);
        box-shadow: 0 0 35px rgba(2, 132, 199, 0.85);
      }
      .bottom-hint {
        font-size: 12px;
        color: #94a3b8;
        background: rgba(15, 23, 42, 0.7);
        padding: 4px 12px;
        border-radius: 9999px;
        backdrop-filter: blur(8px);
      }
      /* Video Modal Overlay */
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.85);
        z-index: 100;
        backdrop-filter: blur(12px);
        align-items: center;
        justify-content: center;
      }
      .modal-card {
        width: 90%;
        max-width: 960px;
        background: #0f172a;
        border: 1px solid var(--border-glass);
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
        padding-bottom: 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      .modal-title {
        font-size: 16px;
        font-weight: 700;
        color: #f8fafc;
      }
      .btn-close {
        background: none;
        border: none;
        color: #94a3b8;
        font-size: 22px;
        cursor: pointer;
        padding: 4px 8px;
        line-height: 1;
      }
      .btn-close:hover {
        color: #ffffff;
      }
      .video-box {
        position: relative;
        padding-top: 56.25%; /* 16:9 */
        border-radius: 12px;
        overflow: hidden;
        background: #000;
      }
      .video-box video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* Toast notification */
      .toast {
        display: none;
        position: fixed;
        bottom: 84px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid var(--cyan);
        padding: 14px 20px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        max-width: 460px;
        width: 90%;
        z-index: 101;
        backdrop-filter: blur(16px);
        text-align: center;
      }
      .toast-title {
        font-weight: 700;
        font-size: 14px;
        color: var(--cyan);
        margin-bottom: 4px;
      }
      .toast-msg {
        font-size: 12px;
        line-height: 1.4;
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <!-- 3D Interactive WebXR Spatial Cockpit Scene -->
    <div id="scene-container"></div>

    <!-- Top Clean Glass Nav Bar -->
    <nav class="top-nav">
      <div class="brand-group">
        <div class="status-dot"></div>
        <div class="brand-title">SynapseDesk AI</div>
        <span class="pill-badge">Meta VR Start 2026</span>
        <span class="pill-badge">Seated 2-Foot Cockpit</span>
      </div>
      <div class="nav-links">
        <button class="nav-btn" onclick="openVideoModal()">
          ▶ Watch 1080p Demo
        </button>
        <a href="./SynapseDesk_AI_Executive_Whitepaper.pdf" target="_blank" class="nav-btn">
          📄 Whitepaper (PDF)
        </a>
        <a href="https://github.com/akshatanand-cell/synapsedesk-ai" target="_blank" class="nav-btn">
          💻 GitHub
        </a>
      </div>
    </nav>

    <!-- Bottom Launch WebXR Bar -->
    <div class="bottom-bar">
      <button id="enter-vr-btn" class="btn-launch-vr" onclick="handleEnterVR()">
        🥽 Launch WebXR VR Cockpit
      </button>
      <div class="bottom-hint">
        Directly interactive on desktop &bull; Open in Meta Quest Browser for hands-first 60 FPS VR immersion
      </div>
    </div>

    <!-- Video Modal -->
    <div id="video-modal" class="modal-overlay">
      <div class="modal-card">
        <div class="modal-header">
          <div class="modal-title">SynapseDesk AI — Official 1080p Demonstration (2m 43s)</div>
          <button class="btn-close" onclick="closeVideoModal()">&times;</button>
        </div>
        <div class="video-box">
          <video id="modal-video" controls preload="metadata" poster="./thumbnail.png">
            <source src="./SynapseDesk_AI_Demo_Video.mp4" type="video/mp4" />
          </video>
        </div>
      </div>
    </div>

    <!-- Headset Detection Toast -->
    <div id="toast" class="toast">
      <div class="toast-title" id="toast-title">Meta Quest Headset Detection</div>
      <div class="toast-msg" id="toast-msg"></div>
    </div>

    <!-- WebXR Application Entry Point -->
    <script type="module" src="/src/index.ts"></script>
    <script>
      function openVideoModal() {
        const modal = document.getElementById('video-modal');
        const video = document.getElementById('modal-video');
        modal.style.display = 'flex';
        video.play();
      }
      function closeVideoModal() {
        const modal = document.getElementById('video-modal');
        const video = document.getElementById('modal-video');
        video.pause();
        modal.style.display = 'none';
      }
      async function handleEnterVR() {
        const toast = document.getElementById('toast');
        const title = document.getElementById('toast-title');
        const msg = document.getElementById('toast-msg');

        if (typeof window.enterSynapseVR === 'function') {
          const res = await window.enterSynapseVR();
          if (!res.success) {
            title.textContent = "Meta Quest Recommended";
            msg.textContent = res.reason || "To enter hands-first immersive VR, open https://synapsedesk-ai.vercel.app directly inside your Meta Quest Browser.";
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 6000);
          }
        } else {
          title.textContent = "Engine Initializing";
          msg.textContent = "Spatial World is loading. If using Meta Quest, wait 2 seconds and tap Launch again.";
          toast.style.display = 'block';
          setTimeout(() => { toast.style.display = 'none'; }, 4000);
        }
      }
    </script>
  </body>
</html>
